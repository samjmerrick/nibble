# Nibble runs next to bee-database, on the same Docker network, and cloudflared sends /nibble to it.
# Needs a .env here with DB_TOKEN (bee's MCP_API_TOKEN, or another admin token) and PUBLIC_URL.
services:
  nibble:
    build: .
    container_name: nibble
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: ${DB_URL:-http://mcp-db:8000}
    ports:
      - "127.0.0.1:8766:8000"   # only if cloudflared runs on the host, not in Docker
    networks: [bee]

networks:
  bee:
    name: ${BEE_NETWORK:-bee-database_default}   # the network bee-database's compose created
    external: true
