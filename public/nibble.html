<title>Nibble</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap">
<style>
/* Layout: a recipe tin. One column of index cards on phones, a two-pane box on wide screens;
   cook mode takes the whole screen with one step at a time.
   Theme: a valley kitchen. Lake blue, meadow green, cream paper, a warm red roof; by night,
   deep blue with lamplight. Soft storybook headings over a plain, legible body. */
:root{
  --bg:#f6f3ea; --surface:#fffdf7; --sunk:#ece8dc; --line:#dcd6c6;
  --fg:#1d2a33; --muted:#5b6670; --accent:#2c6487; --accent-fg:#ffffff; --accent-soft:#dbe8f1;
  --timer:#c08a17; --timer-soft:#f9edcf; --danger:#b23a2e; --danger-soft:#f7e0dc;
  --c-meals:#3c6b48; --c-baking:#a9711f; --c-bread:#88593a; --c-ice-cream:#b0466c;
  --roof:#b8473a; --hill1:#cfe0c9; --hill2:#b6d0b3; --sky:#e3edf2;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px; --shadow:0 1px 2px rgb(30 45 60 / .07), 0 6px 18px rgb(30 45 60 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222c; --sunk:#1d2b37; --line:#2e3f4d;
  --fg:#e9eef2; --muted:#9fb0bd; --accent:#8cc0e0; --accent-fg:#0b1720; --accent-soft:#1c3446;
  --timer:#f2bf52; --timer-soft:#3a2f15; --danger:#f0948a; --danger-soft:#3d201d;
  --c-meals:#86c296; --c-baking:#e6b862; --c-bread:#d6a37c; --c-ice-cream:#eb8fb2;
  --roof:#d8695b; --hill1:#1b2d2a; --hill2:#213833; --sky:#13212c;
  --shadow:0 1px 2px rgb(0 0 0 / .45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222c; --sunk:#1d2b37; --line:#2e3f4d;
  --fg:#e9eef2; --muted:#9fb0bd; --accent:#8cc0e0; --accent-fg:#0b1720; --accent-soft:#1c3446;
  --timer:#f2bf52; --timer-soft:#3a2f15; --danger:#f0948a; --danger-soft:#3d201d;
  --c-meals:#86c296; --c-baking:#e6b862; --c-bread:#d6a37c; --c-ice-cream:#eb8fb2;
  --roof:#d8695b; --hill1:#1b2d2a; --hill2:#213833; --sky:#13212c;
  --shadow:0 1px 2px rgb(0 0 0 / .45); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100;text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
header.top{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 16px 30px;margin:-12px -16px 6px;border-radius:0 0 22px 22px;background:var(--sky);overflow:hidden;isolation:isolate}
header.top .hills{position:absolute;inset:auto 0 0 0;width:100%;height:46px;z-index:-1;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand svg{flex:none;width:42px;height:50px}
header.top h1{font-size:1.65rem;font-weight:700;letter-spacing:-.005em}
.tagline{margin:2px 0 0;color:var(--muted);font-size:.9rem}
/* Add and Sign out sit on one line, the same height, centred on the brand (forms get a bottom margin
   in this page's rendering mode, which used to push Sign out up). On phones they take their own row. */
.head-actions{display:flex;align-items:center;gap:8px}
.head-actions form{margin:0;display:flex}
.head-actions [hidden]{display:none}
@media (max-width:519px){.head-actions{width:100%}.head-actions #importBtn{flex:1;justify-content:center}
  .tools .search{flex-basis:100%}.tools .btn{flex:1;justify-content:center}}
@media (min-width:700px){header.top{margin:4px 0 8px;border-radius:22px;padding:18px 22px 34px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.5rem 1rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;min-height:44px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.timer{background:var(--timer-soft);border-color:var(--timer);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tab{border:0;background:transparent;padding:.45rem .9rem;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700;color:var(--muted);min-height:40px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.6rem 1rem;min-height:44px}
.chk{display:inline-flex;gap:.4rem;align-items:center;color:var(--muted);font-size:.95rem}
.banner{border-radius:var(--r);padding:12px 14px;margin:0 0 14px;background:var(--sunk);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner b{font-family:var(--font-display)}
.banner.warn{background:var(--timer-soft)}
.banner.err{background:var(--danger-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:1fr;gap:12px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 12px;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--cat,var(--line));min-width:0}
.card:hover{transform:translateY(-1px)}
.card h3{font-size:1.08rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{min-height:132px}
.card>.meta:last-child{margin-top:auto;padding-top:6px}
/* filters */
.btn .count{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 .45rem;font-size:.8rem;min-width:1.3rem;text-align:center}
.filters{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin:-4px 0 16px;display:flex;flex-direction:column;gap:10px}
.fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fgroup>b{font-family:var(--font-display);font-size:.9rem;min-width:5.5rem;color:var(--muted);font-weight:700}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .75rem;min-height:36px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.filters[hidden]{display:none}
.fhead{display:flex;align-items:center;gap:8px}.fhead span{margin-right:auto;color:var(--muted);font-size:.9rem}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.1rem .55rem;background:var(--sunk);font-size:.8rem;font-weight:700;color:var(--muted)}
.pill.draft{background:var(--timer-soft);color:var(--fg)}
.pill.fav{background:var(--accent-soft);color:var(--fg)}
.cat-dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--cat);display:inline-block}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
/* recipe icons */
.ico{flex:none;width:52px;height:52px;border-radius:16px;background:color-mix(in srgb, var(--cat) 16%, var(--surface));display:grid;place-items:center}
.ico svg{width:40px;height:40px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ico.big{width:84px;height:84px;border-radius:24px}.ico.big svg{width:66px;height:66px}
.card-top{display:flex;gap:12px;align-items:center;min-width:0}
.card-top>div{min-width:0;display:flex;flex-direction:column;gap:4px}
/* status picker */
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--sunk);width:100%;max-width:520px}
.status button{border:0;background:transparent;border-radius:10px;padding:.4rem .3rem;min-height:40px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.status button[data-v="draft"][aria-pressed="true"]{background:var(--timer-soft)}
/* reading a recipe: the recipe takes the whole screen */
#app.reading>header.top,#app.reading>.tabs,#app.reading>.tools,#app.reading>#status,#app.reading>.filters{display:none}
.readbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 0;background:var(--bg)}
#app.reading .view{min-height:calc(100dvh - 76px)}
/* recipe view */
.view{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 24px;border-top:6px solid var(--cat)}
.view-head{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.view-title{display:flex;gap:14px;align-items:center}
.editform{background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.editform .field textarea{min-height:70px}
.view-head h2{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.scaler{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px}
.scaler button{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;font-weight:700}
.scaler span{min-width:6.5rem;text-align:center;font-variant-numeric:tabular-nums}
.comp{margin-top:22px}
.comp h3{font-size:1.2rem;font-weight:700;display:flex;gap:.5rem;align-items:baseline}
.comp h3 small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:.85rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;margin-top:8px}
@media (max-width:720px){.cols{grid-template-columns:minmax(0,1fr)}}
ul.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.ings li{padding:.35rem 0;border-bottom:1px dashed var(--line);display:flex;gap:.5rem}
ul.ings .q{font-weight:700;min-width:4.6rem;font-variant-numeric:tabular-nums}
ul.ings .n{color:var(--muted)}
/* shopping list: the tick box and the name are separate targets, each at least 44px tall */
.shop-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.shop-bar span{color:var(--muted)}
.shop h3{font-size:1.1rem;font-weight:700;margin:18px 0 2px}
ul.shop-list{list-style:none;margin:0;padding:0}
ul.shop-list li{display:flex;align-items:center;gap:.25rem;border-bottom:1px dashed var(--line)}
.shop .tick{flex:none;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}
.shop .tick input{width:26px;height:26px;margin:0;accent-color:var(--accent);cursor:pointer}
.shop .q{flex:none;font-weight:700;min-width:4.2rem;font-variant-numeric:tabular-nums}
.shop a.name{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;overflow-wrap:anywhere}
.shop li.done .q,.shop li.done a.name{color:var(--muted);text-decoration:line-through}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.5rem}
ol.steps li::before{content:counter(s);font-family:var(--font-display);font-weight:800;color:var(--cat);font-size:1.1rem;text-align:right}
.stepline{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.flag{font-size:.8rem;color:var(--danger)}
.wait{font-size:.88rem;color:var(--muted)}
.notes{margin-top:22px;padding:12px 14px;background:var(--sunk);border-radius:var(--r);white-space:pre-wrap}
a{color:var(--accent)}
/* sheets & overlays */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-top:16px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{margin-right:auto;font-size:1.4rem;font-weight:800}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.6rem .75rem;min-height:44px;width:100%}
.field textarea{min-height:140px;resize:vertical}
/* the add-recipe choices: one segmented control, equal widths, like the status picker */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;margin-bottom:16px;border-radius:14px;background:var(--sunk);max-width:520px}
.seg .tab{min-height:40px;border-radius:10px;text-align:center;overflow:hidden;text-overflow:ellipsis}
.seg .tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
form{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1 1 120px;min-width:0}
.row>.field.wide{flex:2 1 260px}
.progress{color:var(--muted);font-style:italic}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);padding:8px 12px;border-radius:var(--r)}
/* cook mode */
.cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.cook-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cook-top .t{margin-right:auto;min-width:0}
.cook-top .t b{display:block;font-family:var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-top .t span{color:var(--muted);font-size:.85rem}
.bar{height:4px;background:var(--sunk)}
.bar i{display:block;height:100%;background:var(--cat);transition:width .2s}
.cook-body{flex:1;overflow-y:auto;padding:24px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:900px;width:100%;margin:0 auto}
.cook-comp{font-family:var(--font-display);font-weight:700;color:var(--cat);text-transform:uppercase;letter-spacing:.06em;font-size:.9rem}
.cook-step{font-size:clamp(1.6rem,5.2vw,2.6rem);line-height:1.25;font-weight:700}
.cook-ings{display:flex;flex-wrap:wrap;gap:8px}
.cook-ings span{background:var(--sunk);border-radius:8px;padding:.3rem .6rem;font-size:1rem}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.cook-nav .btn{justify-content:center;min-height:60px;font-size:1.15rem;border-radius:14px}
.tray{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0}
.tchip{display:flex;align-items:center;gap:8px;background:var(--timer-soft);border:1px solid var(--timer);border-radius:12px;padding:6px 6px 6px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tchip b{font-size:1.15rem}
.tchip.done{background:var(--timer);color:#1c1405;animation:pulse 1s infinite}
.tchip button{border:0;background:transparent;cursor:pointer;min-width:36px;min-height:36px;border-radius:8px;font-weight:700}
@keyframes pulse{50%{filter:brightness(1.15)}}
@media (prefers-reduced-motion:reduce){.tchip.done{animation:none}.card:hover{transform:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;z-index:60;font-weight:700;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap" id="app">
  <header class="top">
    <svg class="hills" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 30 C60 8 120 10 180 26 S300 40 400 18 V46 H0Z" fill="var(--hill1)"/>
      <path d="M0 40 C80 26 150 30 230 38 S340 30 400 34 V46 H0Z" fill="var(--hill2)"/>
    </svg>
    <div class="brand">
      <svg viewBox="0 0 42 50" aria-hidden="true">
        <rect x="27" y="4" width="4" height="9" rx="1" fill="var(--roof)"/>
        <path d="M21 1 L38 19 H4 Z" fill="var(--roof)" stroke-linejoin="round"/>
        <rect x="7" y="18" width="28" height="31" rx="6" fill="var(--accent)"/>
        <circle cx="21" cy="27" r="3.6" fill="var(--timer-soft)"/>
        <path d="M17 49 V41 a4 4 0 0 1 8 0 V49 Z" fill="var(--surface)"/>
      </svg>
      <div><h1>Nibble</h1><p class="tagline">The family recipe box</p></div>
    </div>
    <div class="head-actions">
      <button class="btn primary" id="importBtn" type="button">+ Add a recipe</button>
      <form method="post" action="/nibble/logout" id="signOut" hidden><button class="btn ghost" type="submit">Sign out</button></form>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search recipes, ingredients, steps" aria-label="Search recipes">
    <button class="btn" id="filterBtn" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
    <button class="btn" id="randomBtn" type="button">🎲 Pick a recipe</button>
  </div>
  <div class="filters" id="filters" hidden></div>
  <div id="status"></div>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div class="sr" aria-live="polite" id="live"></div>

<!--WEB-BOOT-->
<script>
(() => {
"use strict";
/* The same page runs two ways: as a Claude artifact (bee through the viewer's connector,
   Claude for imports) or served by Nibble at /nibble (NIBBLE_APP set by the server, a JSON API
   behind the family sign-in, no Claude). */
const WEB = !!(window.NIBBLE_APP && window.NIBBLE_APP.web);
const CAN_DELETE = !WEB || !!window.NIBBLE_APP.canDelete;
const CAN_EDIT = !WEB || window.NIBBLE_APP.canEdit !== false;
/* Sam's connector is "bee-database"; family members name theirs "Family recipes". */
const SERVERS = ["bee-database", "Family recipes"];
let serverIx = 0;
try { const i = SERVERS.indexOf(localStorage.getItem("rb-server")); if (i > 0) serverIx = i; } catch {}
const CATS = [
  {id:"meals", label:"Meals"}, {id:"baking", label:"Baking"},
  {id:"bread", label:"Bread"}, {id:"ice-cream", label:"Ice cream"},
];
const catLabel = id => (CATS.find(c => c.id === id) || {label:id}).label;
const catVar = id => `var(--c-${CATS.some(c=>c.id===id) ? id : "meals"})`;

/* Original line icons, one per kind of dish. A = category colour, B = paper. */
const A = 'fill="var(--cat)"', B = 'fill="var(--surface)"';
const ICONS = {
  bowl:`<path d="M18 15c-2-3 2-5 0-8M24 15c-2-3 2-5 0-8M30 15c-2-3 2-5 0-8"/><path ${A} d="M7 22h34a17 15 0 0 1-34 0z"/><path d="M16 38h16"/>`,
  pot:`<path ${A} d="M10 19h28v16a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4z"/><path d="M7 19h34M5 24h5M38 24h5"/><path ${B} d="M20 13h8v6h-8z"/>`,
  pasta:`<ellipse ${B} cx="24" cy="33" rx="19" ry="7"/><path ${A} d="M12 31c2-9 22-9 24 0z"/><path d="M16 29c3-5 13-5 16 0M20 29c2-3 6-3 8 0M37 7l-7 20"/>`,

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }

    if (kid == null || kid === false) continue;

  }

/* ---------- bee connector ---------- */
async function call(tool, input, opts){
  if (WEB){
    let res;
    try {
      res = await fetch((window.NIBBLE_APP.apiBase || "/nibble/api/") + encodeURIComponent(tool), {method:"POST", credentials:"same-origin", redirect:"manual",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify(input || {})});
      if (res.type === "opaqueredirect"){ location.reload(); throw {code:"needs_reauth"}; }
    } catch { throw {code:"server_unavailable", retryable:true, message:"bee didn't answer."}; }
    if (res.status === 401){ location.reload(); throw {code:"needs_reauth"}; }
    let body = null; try { body = await res.json(); } catch {}
    if (!res.ok) throw Object.assign({code:"upstream_error"}, (body && body.error) || {}, res.status >= 500 && res.status !== 502 ? {retryable:true} : {});
    return body;
  }
  if (!state.mcp) throw {code:"not_granted"};
  let last;
  for (let n = 0; n < SERVERS.length; n++){
    const i = (serverIx + n) % SERVERS.length;
    let r;
    try { r = await state.mcp.callTool(SERVERS[i], tool, input, opts); }
    catch (e){ last = e; if (e && (e.code === "server_not_connected" || e.code === "not_in_manifest")) continue; throw e; }
    if (i !== serverIx){ serverIx = i; try { localStorage.setItem("rb-server", SERVERS[i]); } catch {} }
    let p = r.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch {} }
    return p;
  }
  throw last;
}
function connCopy(e){
  switch (e && e.code){
    case "server_not_connected": return ["The recipes connector isn't set up", "In claude.ai go to Settings → Connectors → Add custom connector, name it “Family recipes”, use https://mcp.samjmerrick.com/mcp and sign in with the family password. Then reload this page."];
    case "needs_reauth": return ["Sign in to the recipes connector again", `Reconnect “${SERVERS[serverIx]}” in claude.ai Settings → Connectors.`];
    case "selection_required": return ["Choose which connector to use", "Claude asked which recipes connector to use. Pick one and reload."];
    case "not_in_manifest": case "approval_required": return ["This page isn't allowed to read the recipes", "Allow the connector for this page when Claude asks, or turn it on in the page's Permissions menu."];
    case "server_unavailable": return ["The recipe server isn't answering", "bee may be restarting or offline. Try again in a minute."];
    case "tool_error": return ["The recipe server refused that", (e.message || "").slice(0, 300)];
    case "not_granted": case "capability_disabled": case "capability_removed":
      return ["This copy can't reach the recipe box", "Shared copies of this page can't use the recipe connector. Open the family recipe box at https://home.samjmerrick.com/nibble instead."];
    default: return ["Something went wrong talking to the recipe server", (e && e.message || "").slice(0, 300)];
  }
}

/* Load-time cache (this device only): the page paints at once from the last list and the
   recipes opened before, then refreshes from bee in the background. A saved recipe is reused
   only while its updated_at matches the fresh list, so edits always come through. */
const saved = {
  list(){ const v = store.get("rb-list", null); return v && Array.isArray(v.recipes) ? v.recipes : null; },
  setList(recipes){ store.set("rb-list", {t:Date.now(), recipes}); },
  full(id){ const m = store.get("rb-full", {}); return m[id] || null; },
  setFull(r){
    if (!r || !r.id || r.example) return;
    const m = store.get("rb-full", {}); m[r.id] = r;
    const ids = Object.keys(m); if (ids.length > 80) for (const k of ids.slice(0, ids.length - 80)) delete m[k];
    store.set("rb-full", m);
  },
};
async function loadList(refresh){
  try {
    const res = await call("recipe_list", {limit:500}, {cache: refresh ? {staleTime:0, gcTime:86400000, refresh:true} : {staleTime:30000, gcTime:86400000}});
    state.recipes = Array.isArray(res && res.results) ? res.results : [];
    state.conn = "ok"; state.connMsg = ""; state.offline = null;
    saved.setList(state.recipes);
    for (const [id, r] of state.full){ const s = state.recipes.find(x => x.id === id); if (!s || s.updated_at !== r.updated_at) state.full.delete(id); }
  } catch (e){
    const notInstalled = e && e.code === "tool_error" && /unknown tool|not found|recipe_list/i.test(e.message || "");
    if (state.recipes.length && !notInstalled){ state.conn = "ok"; state.offline = e; }
    else { state.conn = notInstalled ? "noTools" : "error"; state.connErr = e; }
  }
  render();
}
async function loadFull(id){
  if (id === "example") return EXAMPLE;
  if (state.full.has(id)) return state.full.get(id);
  const sum = state.recipes.find(x => x.id === id), keep = saved.full(id);
  if (keep && sum && keep.updated_at === sum.updated_at){ state.full.set(id, keep); return keep; }
  const r = await call("recipe_get", {id}, {cache:{staleTime:30000, gcTime:86400000}});
  state.full.set(id, r); saved.setFull(r);
  return r;
}
async function afterWrite(id){
  state.full.delete(id);
  if (!WEB) try { await state.mcp.invalidate(SERVERS[serverIx]); } catch {}
  await loadList(true);
}

/* ---------- formatting ---------- */
const FRAC = [[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"]];
function fmtQty(q, unit){
  if (q == null) return "";
  const small = !unit || /^(tsp|tbsp|cup|cups|clove|cloves|pinch)$/i.test(unit);
  if (small && q < 20){
    const whole = Math.floor(q), rest = q - whole;
    if (rest < .06) return String(whole || "");
    for (const [v, s] of FRAC) if (Math.abs(rest - v) < .06) return (whole ? whole : "") + s;
  }
  if (q >= 100) return String(Math.round(q / 5) * 5);
  return String(Math.round(q * 10) / 10);
}
function ingText(i, f){
  const q = i.qty != null ? fmtQty(i.qty * f, i.unit) + (i.qty_max != null ? "–" + fmtQty(i.qty_max * f, i.unit) : "") : "";
  const unit = i.unit ? (/^[a-z]{1,2}$/i.test(i.unit) ? i.unit : " " + i.unit) : "";
  return {q: q ? q + unit : "", item: i.item, note: scaleNote(i.note, f)};
}
/* Amounts in brackets scale with the servings too: "14 g, melted", "1/3 cup", "1 ½ tsp". */
const GLYPH = {"½":.5, "¼":.25, "¾":.75, "⅓":1/3, "⅔":2/3, "⅛":.125};
const NOTE_QTY = /(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])\s*(kg|g|ml|l|cups?|tbsp|tsp|oz|lb)\b/gi;
function parseAmount(t){
  t = t.trim(); let n = 0;
  for (const part of t.split(/\s+/)){
    if (/^\d+\/\d+$/.test(part)){ const [a, b] = part.split("/").map(Number); n += b ? a / b : 0; }
    else { const m = /^(\d+(?:\.\d+)?)?([½¼¾⅓⅔⅛])?$/.exec(part); if (!m) return null; n += (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? GLYPH[m[2]] : 0); }
  }
  return n;
}
function scaleNote(note, f){
  if (!note || f === 1) return note;
  return String(note).replace(NOTE_QTY, (all, num, unit) => {
    const n = parseAmount(num);
    if (n == null) return all;
    const spoon = /^(cups?|tbsp|tsp)$/i.test(unit);
    const v = fmtQty(n * f, spoon ? "cup" : "g");
    return v + (/^(kg|g|ml|l)$/i.test(unit) ? " " : " ") + unit;
  });
}
/* ---------- shopping list ---------- */
/* shopping-term:start (tests/test_nibble.py runs this block under node; keep it free of page code) */
const SHOP_LEAD = /^(?:(?:about|approx\.?|roughly)\s+|[\d½¼¾⅓⅔⅛][\d½¼¾⅓⅔⅛./–-]*\s*(?:x|×)?\s*|(?:kg|g|ml|l|cl|oz|lb|lbs|tsp|tbsp|cups?|tins?|cans?|packs?|packets?|bunch(?:es)?|handfuls?|cloves?|pinch(?:es)?|splash(?:es)?|dash(?:es)?|knobs?|glugs?|sprigs?|sticks?|slices?|large|small|medium|big|heaped|level|x|×|of)\b\.?\s*)+/i;
const SHOP_PREP = /\b(?:(?:finely|roughly|coarsely|thinly|freshly|lightly|well)\s+)?(?:chopped|sliced|diced|grated|ground|crushed|minced|beaten|peeled|drained|rinsed|melted|softened)\s*$/i;
/* "2 x 400g tins chopped tomatoes, drained" -> "chopped tomatoes": the ingredient on its own,
   with no amount, unit, bracket, prep note or "to taste". */
function shopTerm(item){
  const orig = String(item || "").replace(/\s+/g, " ").trim();
  let t = orig.toLowerCase()
    .replace(/\([^)]*\)?/g, " ")
    .replace(/[,;:].*$/, "")
    .replace(/\s[-–—]\s.*$/, "")
    .replace(/\b(?:to|for)\s+(?:taste|serve|serving|garnish|frying|dusting|greasing|drizzling)\b.*$/, "")
    .replace(/\boptional\b/g, "")
    .replace(/\b(?:finely|roughly|coarsely|thinly|freshly|lightly)\s+(?:chopped|sliced|diced|grated|ground|crushed|minced)\b/g, "")
    .replace(/^an?\s+(?=(?:pinch|handful|bunch|splash|dash|knob|glug)\b)/, "")
    .replace(/\s+/g, " ").trim();
  t = t.replace(SHOP_LEAD, "").trim();
  const bare = t.replace(SHOP_PREP, "").trim();
  if (bare.includes(" ")) t = bare;
  return t.replace(/^[\s.\-–]+|[\s.\-–]+$/g, "") || orig;
}
/* shopping-term:end */
const shopUrl = term => "https://www.sainsburys.co.uk/gol-ui/SearchResults/" + encodeURIComponent(term);
/* One row per ingredient across the whole recipe: the same thing in the same unit is added up and
   shown under the first part that uses it. Returns [{name, rows:[{key, q, item, term}]}]. */
function shoppingList(r, f){
  const seen = new Map(), groups = [];
  for (const c of r.components || []){
    const g = {name: c.name || "", rows: []};
    for (const i of c.ingredients || []){
      const term = shopTerm(i.item), key = term + "|" + (i.unit || "").toLowerCase();
      const have = seen.get(key);
      if (have){
        if (i.qty != null){
          have.qty = (have.qty || 0) + i.qty;
          if (have.qty_max != null || i.qty_max != null) have.qty_max = (have.qty_max != null ? have.qty_max : have.qty - i.qty) + (i.qty_max != null ? i.qty_max : i.qty);
        }
        continue;
      }
      const row = {key, term, item: i.item, unit: i.unit, qty: i.qty, qty_max: i.qty_max};
      seen.set(key, row); g.rows.push(row);
    }
    if (g.rows.length) groups.push(g);
  }
  groups.forEach(g => g.rows.forEach(row => { row.q = ingText(row, f).q; }));
  return groups;
}
function openShopping(r, f, servings){

  const box = h("div", {class:"shop"});

    const n = all.filter(x => ticked.includes(x.key)).length;
    count.textContent = `${n} of ${all.length} ticked`;
    clear.disabled = !n;
    box.replaceChildren(...groups.map(g => h("section", null,

function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${mm}:${String(ss).padStart(2,"0")}`;
}
function fmtMins(m){ if (!m) return ""; return m >= 60 ? `${Math.floor(m/60)} h${m%60 ? " " + m%60 + " min" : ""}` : `${m} min`; }
/* A timer from the step itself, or one read from its text ("12–15 minutes", "1 hour") */
function stepTimer(s){
  if (s.timer_seconds) return {secs:s.timer_seconds, label:s.timer_label || ""};
  const m = /(\d+(?:\.\d+)?)\s*(?:[–-]|to)?\s*(\d+(?:\.\d+)?)?\s*(hours?|hrs?|h\b|minutes?|mins?|seconds?|secs?)/i.exec(s.text || "");
  if (!m) return null;
  const n = parseFloat(m[1]); const u = m[3].toLowerCase();

  const onKey = e => { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); } else if (e.key === "ArrowLeft") go(-1); else if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  function go(d){ pos = Math.max(0, Math.min(flat.length - 1, pos + d)); store.set(key, pos); draw(); }
  function usedIngredients(c, text){
    const t = (text || "").toLowerCase();
    return (c.ingredients || []).filter(i => (i.item || "").toLowerCase().split(/[\s,]+/).some(w => w.length > 3 && t.includes(w.replace(/s$/, ""))));
  }
  function draw(){
    const {c, s, i, n} = flat[pos];
    const tm = stepTimer(s);
    const used = usedIngredients(c, s.text);
    root.replaceChildren(
      h("div", {class:"cook-top"},
        h("div", {class:"t"}, h("b", null, r.title), h("span", null, `Step ${pos + 1} of ${flat.length}${wakeLock ? " · screen stays on" : ""}`)),
        h("button", {class:"btn", type:"button", onclick:close}, "Done")),
      h("div", {class:"bar"}, h("i", {style:`width:${(pos + 1) / flat.length * 100}%`})),
      h("div", {"data-tray":""}),
      h("div", {class:"cook-body"},
        h("div", {class:"cook-comp"}, `${c.name || "Method"} · ${i + 1}/${n}`),
        h("div", {class:"cook-step", "aria-live":"polite"}, s.text),
        s.wait_min_minutes ? h("div", {class:"wait", style:"font-size:1.1rem"}, `Wait ${fmtMins(s.wait_min_minutes)}${s.wait_max_minutes ? "–" + fmtMins(s.wait_max_minutes) : ""}${s.cue ? ". Ready when: " + s.cue : ""}`) : null,
        used.length ? h("div", {class:"cook-ings"}, used.map(u => { const t = ingText(u, f); return h("span", null, (t.q ? t.q + " " : "") + t.item); })) : null,
        tm ? h("div", null, h("button", {class:"btn timer", type:"button", style:"min-height:56px;font-size:1.15rem", onclick:() => addTimer(tm.secs, tm.label || c.name || "Timer")}, `⏱ Start ${fmtTime(tm.secs)} timer`)) : null,
        s.wait_min_minutes && !tm ? h("div", null, h("button", {class:"btn timer", type:"button", onclick:() => addTimer(s.wait_min_minutes * 60, c.name || "Wait")}, `⏱ Remind me in ${fmtMins(s.wait_min_minutes)}`)) : null),
      h("div", {class:"cook-nav"},
        h("button", {class:"btn", type:"button", disabled: pos === 0, onclick:() => go(-1)}, "← Back"),
        pos === flat.length - 1
          ? h("button", {class:"btn primary", type:"button", onclick:() => { store.set(key, 0); close(); toast("Enjoy!"); }}, "Finish")
          : h("button", {class:"btn primary", type:"button", onclick:() => go(1)}, "Next step →")));
    renderTray();
  }
  let sx = null;
  root.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive:true});
  root.addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); sx = null; });
  layer.append(root); draw();
}

/* ---------- import & edit with Claude ---------- */
let FORMAT_GUIDE = null;
async function guide(){
  if (FORMAT_GUIDE) return FORMAT_GUIDE;
  try {
    const g = await call("recipe_format_guide", {}, {cache:{staleTime:3600000, gcTime:604800000}});
    FORMAT_GUIDE = g.guide + "\nICONS (pick one for extra.icon): " + (g.icons || Object.keys(ICONS)).join(", ");
  }
  catch { FORMAT_GUIDE = "Split into named components, each with ingredients (qty number, unit \"g\" for every measured ingredient, original measure in note; counted things like eggs have no unit, item, note) and steps of one action each. Put fixed durations in timer_seconds, and fold the action that ends a wait into the same step. Set extra.icon to one of: " + Object.keys(ICONS).join(", ") + "."; }
  return FORMAT_GUIDE;
}
function convertPrompt(g, sourceLabel, payload){
  return `You are converting a recipe into our family's standard recipe format.\n\n${g}\n\n` +
    `Reply with ONLY one JSON object in the recipe_save shape (no id, status "draft"). Choose "category" from meals, baking, bread, ice-cream. ` +
    `Keep every quantity exactly as the source gives it; if the source gives cups, keep cups. Write UK English.\n\n` +
    `${sourceLabel}:\n${payload}`;
}
function sampleCopy(e){
  switch (e && e.code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      return "This page isn't allowed to ask Claude here. Open it in claude.ai and allow Claude when asked, or add the recipe from a Claude chat.";
    case "rate_limited": return e.reason === "usage_limit" ? "You've reached your Claude usage limit. Try again later." : "Claude is busy with other requests. Try again in a minute.";
    case "invalid_json": return "Claude's answer wasn't a usable recipe. Try again.";
    case "refused": return "Claude wouldn't convert that page. Try pasting the recipe text instead.";
    case "prompt_too_large": return "That page is too long. Paste just the recipe part.";
    case "image_rejected": return "That photo couldn't be read. Try a clearer or smaller photo.";
    case "session_expired": return "Sign in to Claude again, then retry.";
    case "cancelled": return "Stopped.";
    default: return "Something went wrong asking Claude. Try again.";
  }
}
function normalise(rec, fallback){
  if (!rec || typeof rec !== "object" || Array.isArray(rec)) throw {code:"invalid_json"};
  const out = {...rec};
  out.title = String(out.title || fallback.title || "Untitled recipe").trim();
  out.category = CATS.some(c => c.id === out.category) ? out.category : (fallback.category || "meals");
  out.status = "draft";
  if (fallback.source_url && !out.source_url) out.source_url = fallback.source_url;
  if (fallback.image_url && !out.image_url) out.image_url = fallback.image_url;
  out.components = (Array.isArray(out.components) ? out.components : []).map(c => ({
    name: String((c && c.name) || ""),
    ingredients: (Array.isArray(c && c.ingredients) ? c.ingredients : []).map(i => typeof i === "string" ? {item:i} : i).filter(i => i && i.item),
    steps: (Array.isArray(c && c.steps) ? c.steps : []).map(s => typeof s === "string" ? {text:s} : s).filter(s => s && s.text),
  })).filter(c => c.steps.length || c.ingredients.length);
  if (!out.components.length) throw {code:"invalid_json"};
  delete out.id;
  return out;
}
function checks(rec){
  const steps = rec.components.flatMap(c => c.steps.map(s => s.text));
  const all = steps.join(" ").toLowerCase();
  const long = steps.filter(multiAction);
  const unused = rec.components.flatMap(c => c.ingredients).filter(i => !(i.item || "").toLowerCase().split(/[\s,]+/).some(w => w.length > 3 && all.includes(w.replace(/s$/, ""))));
  return {long, unused, steps: steps.length, timers: rec.components.flatMap(c => c.steps).filter(stepTimer).length};
}

function sheet(title, ...content){
  const close = () => root.remove();
  const root = h("div", {class:"sheet", role:"dialog", "aria-modal":"true", "aria-label":title},
    h("div", {class:"wrap"}, h("div", {class:"sheet-head"}, h("h2", null, title), h("button", {class:"btn", type:"button", onclick:() => close()}, "Close")), ...content));
  $("layer").append(root);
  return {root, close, body: root.querySelector(".wrap")};
}

function openImport(){
  let mode = "link";
  const area = h("div");
  const s = sheet("Add a recipe", area);
  const draw = () => {
    const seg = h("div", {class:"seg", role:"tablist"}, (WEB ? [["link","From a link"],["text","Paste text"]] : [["link","From a link"],["text","Paste text"],["photo","From a photo"]]).map(([id, label]) =>
      h("button", {class:"tab", type:"button", role:"tab", "aria-selected": String(mode === id), onclick:() => { mode = id; draw(); }}, label)));
    const out = h("div");
    let form;
    if (mode === "link"){
      form = h("form", null,
        h("div", {class:"field"}, h("label", {for:"impUrl"}, "Recipe web page"), h("input", {id:"impUrl", type:"url", required:true, placeholder:"https://www.bbcgoodfood.com/recipes/…", inputmode:"url"})),
        h("button", {class:"btn primary", type:"submit"}, "Read the recipe"));
    } else if (mode === "text"){
      form = h("form", null,
        h("div", {class:"field"}, h("label", {for:"impText"}, "Recipe text"), h("textarea", {id:"impText", required:true, placeholder: WEB ? "Title on the first line, then an \u201cIngredients\u201d list (one per line) and a \u201cMethod\u201d (one step per line)" : "Paste the ingredients and method here"})),
        h("div", {class:"field"}, h("label", {for:"impSrc"}, "Where it's from (optional)"), h("input", {id:"impSrc", type:"url", placeholder:"https://…"})),
        h("button", {class:"btn primary", type:"submit"}, "Convert the recipe"));
    } else {
      form = h("form", null,
        h("div", {class:"field"}, h("label", {for:"impPhoto"}, "Photo of a recipe page"), h("input", {id:"impPhoto", type:"file", accept:"image/jpeg,image/png,image/webp", required:true})),
        h("button", {class:"btn primary", type:"submit"}, "Read the photo"));
    }
    form.addEventListener("submit", e => { e.preventDefault(); runImport(mode, form, out); });
    area.replaceChildren(seg, form, h("div", {style:"height:14px"}), out);
  };
  draw();
  async function runImport(kind, form, out){
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
    const ctl = new AbortController();
    const prog = h("p", {class:"progress"}, "Working…");
    out.replaceChildren(prog, h("button", {class:"btn", type:"button", onclick:() => ctl.abort()}, "Stop"));
    try {
      if (!state.sample && !WEB) throw {code:"not_granted"};
      const g = WEB ? "" : await guide();
      let rec, fallback = {};
      if (kind === "link" && WEB){
        /* Nibble fetches the page and converts it (with its model when one is set up). */
        const url = form.querySelector("#impUrl").value.trim();
        prog.textContent = "Fetching and converting the recipe… this can take up to a minute.";
        try { rec = await call("recipe_import_page", {url}); }
        catch (e){ throw {code:"fetch", message: e && e.code === "tool_error" ? (e.message || "") : connCopy(e)[1]}; }
        fallback = {source_url: rec.source_url || url, image_url: rec.image_url, title: rec.title};
      } else if (kind === "link"){
        const url = form.querySelector("#impUrl").value.trim();
        prog.textContent = "Fetching the page on bee…";
        let page;
        try { page = await call("recipe_fetch_page", {url}); }
        catch (e){ throw {code:"fetch", message: e && e.code === "tool_error" ? (e.message || "") : connCopy(e)[1]}; }
        fallback = {source_url: page.url || url, image_url: page.image, title: (page.structured && page.structured.name) || page.title};
        const payload = JSON.stringify({structured_data: page.structured, page_text: page.structured ? (page.text || "").slice(0, 6000) : page.text, url: page.url});
        prog.textContent = page.structured ? "Found the recipe data. Claude is splitting the steps…" : "No recipe data on that page. Claude is reading the page text…";
        rec = await state.sample.json(convertPrompt(g, "Source page (structured_data is exact; use it for ingredients and quantities)", payload), {signal: ctl.signal, cache:false});
      } else if (kind === "text"){
        const src = form.querySelector("#impSrc").value.trim();
        fallback = {source_url: safeUrl(src)};
        const text = form.querySelector("#impText").value.slice(0, 40000);
        if (WEB){
          /* Nibble converts it: with its model when one is set up, else by reading headings and numbered steps. */
          prog.textContent = "Converting the recipe… this can take up to a minute.";
          try { rec = await call("recipe_parse_text", {text, source_url: fallback.source_url || null}); }
          catch (e){ throw {code:"parse", message: e && e.code === "tool_error" ? (e.message || "") : connCopy(e)[1]}; }
        } else {
        prog.textContent = "Claude is converting the recipe…";
        rec = await state.sample.json(convertPrompt(g, "Recipe text", text), {signal: ctl.signal, cache:false});
        }
      } else {
        const file = form.querySelector("#impPhoto").files[0];
        prog.textContent = "Claude is reading the photo…";
        rec = await state.sample.json(convertPrompt(g, "Recipe", "The attached photo shows a recipe page. Transcribe it faithfully."), {signal: ctl.signal, images:[file], cache:false});
      }
      const how = rec && rec._import; if (rec) delete rec._import;
      showReview(normalise(rec, fallback), out, s, undefined, how);
    } catch (e){
      out.replaceChildren(h("div", {class:"banner err"}, e && e.code === "fetch" ? `Couldn't fetch that page: ${e.message} Paste the recipe text instead.` : e && e.code === "parse" ? e.message : sampleCopy(e)));
    } finally { btn.disabled = false; }
  }
}

function showReview(rec, out, s, existingId, how){
  const c = checks(rec);
  const howNote = !how ? null : h("p", {class:"progress", style:"margin:0 0 10px"},
    how.by === "reader" ? "Read by Nibble without AI: steps are as written, so check them before saving." :
    how.by === "page" ? "Taken from the page's own recipe data without AI: steps are as written, so check them before saving." :
    `Converted by ${how.by}. Check the quantities before saving.`,
    how.why ? ` (The AI model wasn't available: ${how.why})` : "");
  const titleIn = h("input", {id:"revTitle", value: rec.title});
  const catIn = h("select", {id:"revCat"}, CATS.map(cat => h("option", {value:cat.id, selected: cat.id === rec.category}, cat.label)));
  const servIn = h("input", {id:"revServ", type:"number", min:"1", value: rec.servings || ""});
  const preview = h("div");
  preview.append(recipeViewStatic(rec));
  const saveBtn = h("button", {class:"btn primary", type:"button"}, existingId ? "Save changes" : "Save as draft");
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    const toSave = {...rec, title: titleIn.value.trim() || rec.title, category: catIn.value, servings: servIn.value ? Number(servIn.value) : null};
    if (existingId){ toSave.id = existingId; toSave.status = rec.status; }
    try {
      const saved = await call("recipe_save", {recipe: toSave});
      toast(existingId ? "Recipe updated" : "Saved as a draft. Approve it to add it to the box.");
      s.close(); await afterWrite(saved.id); state.full.set(saved.id, saved); openRecipe(saved.id);
    } catch (e){ saveBtn.disabled = false; toast(connCopy(e)[0]); }
  };
  out.replaceChildren(...(howNote ? [howNote] : []),
    h("div", {class:"banner" + (c.long.length || c.unused.length ? " warn" : "")}, h("div", null,
      h("b", null, `${c.steps} steps, ${c.timers} timer${c.timers === 1 ? "" : "s"}. `),
      c.long.length ? `${c.long.length} step${c.long.length > 1 ? "s" : ""} may hold more than one action (marked below). ` : "Every step is a single action. ",
      c.unused.length ? `Not used in any step: ${c.unused.map(i => i.item).join(", ")}.` : "")),
    h("div", {class:"row"},
      h("div", {class:"field wide"}, h("label", {for:"revTitle"}, "Title"), titleIn),
      h("div", {class:"field"}, h("label", {for:"revCat"}, "Category"), catIn),
      h("div", {class:"field"}, h("label", {for:"revServ"}, "Serves"), servIn)),
    h("div", {class:"actions"}, saveBtn),
    preview);
}
function recipeViewStatic(r){
  const el = h("article", {class:"view", style:`--cat:${catVar(r.category)}`});
  r.components.forEach(c => el.append(h("section", {class:"comp"}, h("h3", null, c.name || "Method"),
    h("div", {class:"cols"},
      h("ul", {class:"ings"}, c.ingredients.map(i => { const t = ingText(i, 1); return h("li", null, h("span", {class:"q"}, t.q), h("span", null, t.item, t.note ? h("span", {class:"n"}, ` (${t.note})`) : null)); })),
      h("ol", {class:"steps"}, c.steps.map(st => { const tm = stepTimer(st); return h("li", null, h("div", {class:"stepline"}, h("span", null, st.text),
        multiAction(st.text) ? h("span", {class:"flag"}, "May be more than one action") : null,
        st.wait_min_minutes ? h("span", {class:"wait"}, `Wait ${fmtMins(st.wait_min_minutes)}${st.wait_max_minutes ? "–" + fmtMins(st.wait_max_minutes) : ""}${st.cue ? ": " + st.cue : ""}`) : null,
        tm ? h("span", {class:"pill"}, `⏱ ${fmtTime(tm.secs)}`) : null)); }))))));
  return el;
}

function openEdit(r){
  const out = h("div");
  const form = h("form", null,
    h("p", {style:"margin-top:0;color:var(--muted)"}, "Say what to change and Claude rewrites the recipe. You check it before it saves."),
    h("div", {class:"field"}, h("label", {for:"editAsk"}, "What should change?"),
      h("textarea", {id:"editAsk", required:true, placeholder:"Split the steps more finely. Make it serve 4. Add a timer to step 3. Add a note that we use half the chilli."})),
    h("button", {class:"btn primary", type:"submit"}, "Rewrite"));
  const s = sheet("Change " + r.title, form, h("div", {style:"height:14px"}), out);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
    out.replaceChildren(h("p", {class:"progress"}, "Claude is rewriting the recipe…"));
    try {
      if (!state.sample) throw {code:"not_granted"};
      const g = await guide();
      const current = {...r}; delete current.id; delete current.created_at; delete current.updated_at; delete current.origin;
      const rec = await state.sample.json(`${g}\n\nHere is a recipe in our standard format:\n${JSON.stringify(current)}\n\nChange it as asked, keeping everything else the same. Reply with ONLY the whole updated recipe as one JSON object.\n\nAsked change: ${form.querySelector("#editAsk").value.slice(0, 2000)}`, {cache:false});
      const n = normalise(rec, {title:r.title, category:r.category, source_url:r.source_url});
      n.status = r.status;
      showReview(n, out, s, r.id);
    } catch (err){ out.replaceChildren(h("div", {class:"banner err"}, sampleCopy(err))); }
    finally { btn.disabled = false; }
  });
}

/* ---------- render ---------- */
function render(){
  renderTabs(); renderFilters(); statusBanner();
  const main = $("main");
  const wasReading = $("app").classList.contains("reading");
  $("app").classList.toggle("reading", !!state.openId);
  main.replaceChildren(state.openId ? renderRecipeShell() : renderList());
  if (!!state.openId !== wasReading) window.scrollTo(0, 0);
  if (!state.openId) main.prepend(h("div", {"data-tray":""}));
  renderTray();
}
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); if (state.openId) state.openId = null; render(); });
$("importBtn").addEventListener("click", openImport);
if (WEB) $("signOut").hidden = false;
if (!CAN_EDIT) $("importBtn").hidden = true;
$("randomBtn").addEventListener("click", pickRandom);
$("filterBtn").addEventListener("click", () => { const b = $("filters"); b.hidden = !b.hidden; $("filterBtn").setAttribute("aria-expanded", String(!b.hidden)); renderFilters(); });
window.addEventListener("hashchange", () => { const m = /^#recipe-([a-z0-9]+)$/i.exec(location.hash); state.openId = m ? m[1] : null; render(); });

(async () => {
  const m = /^#recipe-([a-z0-9]+)$/i.exec(location.hash); if (m) state.openId = m[1];
  render();
  const cached = saved.list();
  if (cached && cached.length){ state.recipes = cached; state.conn = "ok"; render(); }
  if (WEB){ loadList(!!cached); return; }
  const claude = window.claude;
  if (!claude || !claude.use){ if (!cached){ state.conn = "error"; state.connErr = {code:"not_granted"}; render(); } return; }
  claude.use("sample").then(s => { state.sample = s; });
  state.mcp = await claude.use("mcp");
  if (!state.mcp){ if (!cached) { state.conn = "error"; state.connErr = {code:"not_granted"}; render(); } return; }
  loadList(!!cached);
})();
})();
</script>
